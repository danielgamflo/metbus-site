 <!-- CABECERA -->
 <div class="cabecera-color">

    <h1>Recorridos</h1>
  </div>
</div>
 
 <!-- CUERPO DE RECORRIDOS -->
  <section class="recorridos-section">
    <div class="recorridos-buscador">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="buscadorRecorrido" placeholder="Busca por número o destino…" autocomplete="off">
      <span class="recorridos-count" id="recorridosCount"></span>
    </div>
    <div class="recorridos-container">
      <!-- Los recorridos se cargarán dinámicamente aquí -->
    </div>
  </section>
