apiVersion: apps/v1
kind: Deployment
metadata:
  name: metbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metbus
  template:
    metadata:
      labels:
        app: metbus
    spec:
      containers:
      - name: metbus
        image: 67566756/metbus-site:v3
        resources:
          requests:
            memory: "50Mi"
            cpu: "100m"
          limits:
            memory: "100Mi"
        ports:
        - containerPort: 4000

---

apiVersion: v1
kind: Service
metadata:
  name: metbus
spec:
  selector:
    app: metbus
  ports:
  - port: 4000
    targetPort: 4000
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metbus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: "demo-metbus.bhernandez.org"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: metbus
            port:
              number: 4000