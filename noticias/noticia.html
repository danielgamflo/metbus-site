<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="../assets/icons/icon-metbus.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noticia — Metbus</title>
  <meta name="description" content="Noticias de Metbus, empresa líder en transporte público sustentable en Santiago, Chile.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Metbus">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="../css/components/noticia-multimedia.css">
  <link rel="stylesheet" href="../css/components/foto-lightbox.css">
  <link rel="stylesheet" href="../css/components/video-lightbox.css">
  <link rel="stylesheet" href="../css/noticia_individual.css">
  <link rel="stylesheet" href="../css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body class="noticias noticia-multimedia">

  <!-- Header -->
  <header id="siteHeader">
    <div class="container nav">
      <div class="brand">
        <a href="../index.html">
          <img src="../assets/logo/metbuslogo.svg" alt="METBUS Logo" class="logo-img">
        </a>
      </div>
      <nav class="menu" aria-label="Principal">
        <a href="../index.html">Home</a>
        <a href="../recorridos.html">Recorridos</a>
        <a href="../quienes-somos.html">Quienes Somos</a>
        <a href="../noticias.html">Noticias</a>
        <a href="../sostenibilidad.html">Sostenibilidad</a>
        <a href="../mesa-de-ayuda.html">Mesa de Ayuda</a>
      </nav>
    </div>
    <button class="hamburger-btn" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Menú móvil -->
  <nav class="mobile-menu" aria-hidden="true">
    <div class="menu-content">
      <button class="close-btn" aria-label="Cerrar menú">&times;</button>
      <ul>
        <li><a href="../index.html">HOME</a></li>
        <li><a href="../recorridos.html">RECORRIDOS</a></li>
        <li><a href="../quienes-somos.html">QUIENES SOMOS</a></li>
        <li><a href="../noticias.html">NOTICIAS</a></li>
        <li><a href="../sostenibilidad.html">SOSTENIBILIDAD</a></li>
        <li><a href="../mesa-de-ayuda.html">MESA DE AYUDA</a></li>
      </ul>
    </div>
  </nav>

  <!-- Cabecera naranja -->
  <div class="cabecera-color">
    <div class="cabecera-titulo">
      <img class="flecha-icono" src="../assets/icons/flecha-metbus-white.png" alt="Flecha">
      <h1>Noticias</h1>
    </div>
  </div>

  <!-- Artículo: renderizado por noticia.js -->
  <main class="noticia" id="noticia-main">
    <div class="container">
      <div id="noticia-meta">
        <!-- JS inyecta: etiqueta, titulo, fecha, ubicacion -->
      </div>
    </div>

    <!-- Para tipo "basica": imagen de portada -->
    <div id="noticia-portada"></div>

    <!-- Para tipo "galeria": carrusel de fotos -->
    <div id="noticia-galeria"></div>

    <div class="container">
      <div class="contenido" id="noticia-contenido">
        <!-- JS inyecta el contenido HTML -->
      </div>
    </div>

    <!-- Para tipo "video": preview + modal -->
    <div id="noticia-video"></div>

    <!-- Galería lightbox extra (cuando se añade a noticia básica o video) -->
    <div id="noticia-galeria-extra"></div>
  </main>

  <!-- Noticias relacionadas -->
  <section id="noticias" class="section container">
    <div class="center" style="margin-bottom:var(--space)">
      <span class="pill">Noticias Relacionadas</span>
      <h2>Últimas <span class="accent">Novedades</span></h2>
    </div>
    <div class="news-carousel">
      <button class="carousel-btn prev">‹</button>
      <div class="news-track-wrapper">
        <div class="news-track" id="newsTrack"></div>
      </div>
      <button class="carousel-btn next">›</button>
    </div>
  </section>

  <!-- Historia + convoy -->
  <div id="historia-placeholder"></div>
  <script>
    fetch("../components/historia.html")
      .then(res => res.text())
      .then(html => { document.getElementById("historia-placeholder").innerHTML = html; });
  </script>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
  <script>
    fetch("../components/footer.html")
      .then(res => res.text())
      .then(html => { document.getElementById("footer-placeholder").innerHTML = html; });
  </script>

  <!-- JS -->
  <script src="../js/core/header.js"></script>
  <script src="../js/core/menu.js"></script>
  <script src="../js/pages/noticia.js"></script>
  <script src="../js/pages/news.js"></script>

</body>
</html>
