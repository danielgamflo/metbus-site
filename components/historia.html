<section class="historia-section container" id="historia" aria-label="Nuestra historia">
  <div class="historia-mask">
  <div class="historia-loop">
    <div class="line">NUESTRA <span class="accent">HISTORIA</span></div>
    <div class="line">SOMOS <span class="accent">IMAGEN PAÍS</span></div>
    <div class="line">NUESTRO <span class="accent">COMPROMISO</span></div>
    <div class="line">EVOLUCIÓN <span class="accent">ELÉCTRICA</span></div>
   

    <!-- duplicado para loop seamless -->
    <div class="line">NUESTRA <span class="accent">HISTORIA</span></div>
  </div>
</div>
  
  <!-- Tren de buses -->
  <div class="news-bus" aria-hidden="true">
    <div class="bus-train" style="--speed: 28s">

      <!-- Bus 1: Pinina -->
      <div class="bus" style="--ord:5; --h:92px; --wheel-d:28px; --w1:75px; --w2:226px;">
        <img class="bus-body" src="/assets/images/convoy/bus-body-pinina.webp" alt="Bus histórico Pinina" loading="lazy">
        <img class="bus-wheel wheel-rear" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-front" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
      </div>

      <!-- Bus 2: Articulado Diésel -->
      <div class="bus" style="--ord:4; --h:92px; --wheel-d:28px;">
        <img class="bus-body" src="/assets/images/convoy/bus-articulado-diesel.webp" alt="Bus articulado diésel" loading="lazy">
        <img class="bus-wheel wheel-rear" style="left:76px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-middle" style="left:252px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-front" style="left:392px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
      </div>

      <!-- Bus 3: Eléctrico 1 -->
      <div class="bus" style="--ord:3; --h:92px; --wheel-d:28px; --w1:75px; --w2:240px;">
        <img class="bus-body" src="/assets/images/convoy/bus-electrico-1.webp" alt="Bus eléctrico 1" loading="lazy">
        <img class="bus-wheel wheel-rear" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-front" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
      </div>

      <!-- Bus 4: Eléctrico 2 -->
      <div class="bus" style="--ord:2; --h:121px; --wheel-d:28px;">
        <img class="bus-body" src="/assets/images/convoy/bus-electrico-2.webp" alt="Bus eléctrico 2 articulado" loading="lazy">
        <img class="bus-wheel wheel-rear" style="left:57px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-middle" style="left:100px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-front" style="left:257px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
      </div>

      <!-- Bus 5: Eléctrico 3 -->
      <div class="bus" style="--ord:1; --h:92px; --wheel-d:28px;">
        <img class="bus-body" src="/assets/images/convoy/bus-electrico-4-new.png" alt="Bus eléctrico 3 articulado" loading="lazy">
        <img class="bus-wheel wheel-rear" style="left:71px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-middle" style="left:233px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
        <img class="bus-wheel wheel-front" style="left:382px" src="/assets/images/convoy/wheel-01.webp" alt="" loading="lazy">
      </div>
    </div>
  </div>
</section>
